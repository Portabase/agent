apiVersion: apps/v1
kind: Deployment
metadata:
  name: portabase-agent
  labels:
    app: portabase-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: portabase-agent
  template:
    metadata:
      labels:
        app: portabase-agent
    spec:
      hostAliases:
      {{- range .Values.network.hostAliases }}
        - ip: {{ .ip }}
          hostnames:
        {{- range .hostnames }}
            - {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: portabase-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: portabase-agent-env
          {{- if .Values.volume.restore.enabled }}
          env:
            - name: RESTORE_PATH
              value: {{ .Values.volume.restore.mountPath | quote }}
          {{- end }}
          volumeMounts:
            {{- if .Values.volume.restore.enabled }}
            - name: restore
              mountPath: {{ .Values.volume.restore.mountPath }}
            {{- end }}
            {{- if .Values.volume.configFile.enabled }}
              {{- if .Values.volume.configFile.hostPath }}
            - name: config
              mountPath: /config/config.json
              subPath: config.json
              readOnly: true
              # uses hostPath
              {{- else }}
            - name: config
              mountPath: /config/config.json
              subPath: config.json
              # uses ConfigMap content
              {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.volume.configFile.enabled }}
          {{- if .Values.volume.configFile.hostPath }}
        - name: config
          hostPath:
            path: {{ .Values.volume.configFile.hostPath }}
            type: File
          {{- else }}
        - name: config
          configMap:
            name: portabase-agent-config
            items:
              - key: config.json
                path: config.json
          {{- end }}
        {{- end }}
        {{- if .Values.volume.restore.enabled }}
        - name: restore
          {{- if .Values.volume.restore.hostPath }}
          hostPath:
            path: {{ .Values.volume.restore.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ required "volume.restore.hostPath or volume.restore.existingClaim is required" .Values.volume.restore.existingClaim }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}