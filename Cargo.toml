[package]
name = "portabase-agent"
version = "1.25.2"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[dependencies]
redis = { version = "1.0.2", default-features = false, features = ["aio", "tokio-comp"] }
cron = "0.15.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
dotenvy = "0.15"
once_cell = "1.17"
base64 = "0.22.1"
thiserror = "2.0.17"
toml = "0.9.10"
reqwest = { version = "0.13.1", features = ["json", "stream", "query"] }
anyhow = "1.0.100"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net"] }
async-trait = "0.1.89"
tempfile = "3.24.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4.3"
flate2 = "1.1.5"
tar = "0.4.44"
tokio-postgres = "0.7.15"
futures = "0.3.31"
tracing-appender = "0.2.4"
time = { version = "0.3.44", features = ["macros"] }
mongodb = "3.5.1"
rand = "0.9.2"
bytes = "1.11.0"
async-stream = "0.3.6"
uuid = { version = "1.20.0", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["compat", "io"] }
tiberius = { version = "0.13", default-features = false, features = ["rustls"] }
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "http-1x", "default-https-client", "rt-tokio"] }
azure_core = "1.0.0"
azure_storage_blob = "1.0.0"
google-cloud-storage = "1.15"
google-cloud-auth = "1.13"
async-compression = { version = "0.4.37", features = ["tokio", "gzip"] }
tokio-tar = "0.3.1"
oauth2 = "5.0.0"
aes-gcm = "0.11"
futures-util = "0.3.31"
tokio-stream = "0.1.18"
url = "2.5.8"
percent-encoding = "2.3.2"
# bollard must match the version testcontainers uses (bollard-stubs is pinned
# exactly, so two bollards cannot coexist). Upgrade bollard, testcontainers and
# testcontainers-modules together.
bollard = "0.20.0"
rustls = "0.23"
globset = "0.4"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
testcontainers = "0.27.1"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis", "valkey", "mysql", "mariadb", "mongo"] }
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "app"
path = "src/main.rs"
